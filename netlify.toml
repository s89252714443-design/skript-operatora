# Настройки сборки для Netlify.
#
# Репозиторий остаётся закрытым: Netlify забирает код по доступу, который вы
# ему выдали, а наружу отдаёт только собранную статику. Данные о клиниках
# при этом всё равно оказываются доступны любому, кто знает адрес, — если
# понадобится вход по паролю, это настраивается отдельно.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Маршрутизация внутри приложения идёт через #, поэтому переадресация путей
# не нужна — сервер всегда отдаёт одну и ту же страницу.
