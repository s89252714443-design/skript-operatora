# Сборка и публикация сайта на GitHub Pages при каждом коммите в main.
#
# Собирается та же команда, что и локально (npm run build), поэтому
# расхождений между «у меня работало» и тем, что видят коллеги, не будет.
name: Публикация сайта

on:
  push:
    branches: [main]
  # даёт возможность запустить сборку руками из вкладки Actions
  workflow_dispatch:

# Разрешения ровно те, что нужны публикации, и ни одним больше
permissions:
  contents: read
  pages: write
  id-token: write

# Параллельные публикации не нужны: важен последний коммит.
# Начатую сборку не обрываем, чтобы не оставить сайт в полусобранном виде.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Тесты гоняем до сборки: сломанный подбор клиник не должен уехать
      # к операторам только потому, что сборка прошла.
      - run: npm test

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
